[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"   # verificar contra outputPath en angular.json

[build.environment]
  NODE_VERSION = "24"

# Archivos con nombre único por versión: el navegador los guarda un año
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rutas reservadas para archivos de descubrimiento (agentes, seguridad, etc.):
# si el archivo no existe, se responde 404 en lugar de la aplicación
[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404

# Angular maneja las rutas en el navegador: cualquier otra URL sirve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200